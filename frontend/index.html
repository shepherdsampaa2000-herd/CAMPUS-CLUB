<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Club Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Campus Club Profile</h1>
        <p>Manage university clubs in one place</p>
    </header>

    <main>
        <section class="form-section">
            <h2 id="formTitle">Add a New Club</h2>

            <form id="clubForm">
                <input type="hidden" id="clubId">

                <div class="form-grid">
                    <div>
                        <label for="name">Club Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div>
                        <label for="category">Category</label>
                        <input type="text" id="category" required>
                    </div>

                    <div>
                        <label for="location">Location</label>
                        <input type="text" id="location" required>
                    </div>

                    <div>
                        <label for="meeting_day">Meeting Day</label>
                        <select id="meeting_day" required>
                            <option value="">Choose a day</option>
                            <option>Monday</option>
                            <option>Tuesday</option>
                            <option>Wednesday</option>
                            <option>Thursday</option>
                            <option>Friday</option>
                            <option>Saturday</option>
                            <option>Sunday</option>
                        </select>
                    </div>

                    <div>
                        <label for="membership_count">Number of Members</label>
                        <input
                            type="number"
                            id="membership_count"
                            min="0"
                            step="1"
                            placeholder="Enter number of members"
                            required
                        >
                    </div>

                    <div class="full-width">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3" required></textarea>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="saveButton">Add Club</button>
                    <button type="button" id="cancelButton" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="clubs-section">
            <div class="section-heading">
                <div>
                    <h2>Registered Clubs</h2>
                    <p>View and manage all campus clubs.</p>
                </div>
                <button type="button" id="refreshButton">Refresh</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Club Name</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Meeting Day</th>
                            <th>Members</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="clubsTable">
                        <tr>
                            <td colspan="10">Loading clubs...</td>
                        </tr>
                    </tbody>
                </table>
